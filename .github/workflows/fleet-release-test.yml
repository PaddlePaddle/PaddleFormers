  unittest-gpu-ci:
    name: unittest-gpu-ci
    needs: [check-bypass, build_whl, check_documents_type]
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' && needs.check_documents_type.outputs.is_md_only != 'true' }}
    runs-on: ernie-unittest
    env:
      TASK: PaddleFormers_CI_unittest_gpu_${{ github.event.pull_request.number }}
      IMAGE_NAME: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda129-dev
      python_version: 3.12
      paddle_whl: https://paddle-qa.bj.bcebos.com/paddle-pipeline/Develop-TagBuild-Training-Linux-Gpu-Cuda12.9-Cudnn9.9-Trt10.5-Mkl-Avx-Gcc11-SelfBuiltPypiUse/latest/paddlepaddle_gpu-0.0.0-cp312-cp312-linux_x86_64.whl
      PYTEST_EXECUTE_FLAG_FILE: ${{ github.workspace }}/../../../PYTEST_EXECUTE_FLAG_FILE/${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}/pytest_execute.flag
    steps:
      - name: Determine the runner
        run: |
          gpu_id=$(( $(echo $PWD | awk -F'/' '{print $4}' | awk -F'_' '{print $2}') ))
          echo $PWD
          echo GPU_DEVICES="$gpu_id" >> $GITHUB_ENV
      - name: Run Container
        env:
          FLAGS_dynamic_static_unified_comm: "True"
          PIP_CACHE_DIR: /root/.cache/pip
          GPU_DEVICES: ${{ env.GPU_DEVICES }}
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "GPU_DEVICES=$GPU_DEVICES"
          echo "container_name=${container_name}" >> "$GITHUB_ENV"
          echo "Workspace path: ${{ github.workspace }}"
          docker run -d -t --name ${container_name} --gpus device=${GPU_DEVICES} --runtime=nvidia --net=host -v /dev/shm:/dev/shm --shm-size=32G \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../..:/root \
            -v ${{ github.workspace }}/../../../proxy:/root/proxy \
            -v ${{ github.workspace }}:/workspace \
            -v /home/.cache/:/root/.cache/ \
            -v /home/paddle-1/models/:/home/models/ \
            -e PF_HOME=/home/models/ \
            -e PR_ID \
            -e BRANCH \
            -e COMMIT_ID \
            -e AGILE_COMPILE_BRANCH=${{ github.event.pull_request.base.ref }} \
            -e CUDA_VISIBLE_DEVICES=${GPU_DEVICES} \
            -e NVIDIA_VISIBLE_DEVICES=${GPU_DEVICES} \
            -e PYTEST_EXECUTE_FLAG_FILE \
            -e no_proxy \
            -e paddle_whl \
            -e FLAGS_dynamic_static_unified_comm=$FLAGS_dynamic_static_unified_comm \
            -e python_version \
            -e USE_PREBUILT_WHEELS=true \
            -e HF_PROXY_PATH=${{ github.workspace }}/../../../proxy_huggingface \
            -e AISTUDIO_PROXY_PATH=${{ github.workspace }}/../../../proxy_aistudio \
            -e HF_DATASETS_CACHE=${{ github.workspace }}/../../../paddlenlp/huggingface/datasets \
            -e TRANSFORMERS_CACHE=${{ github.workspace }}/../../../paddlenlp/huggingface \
            -e PIP_CACHE_DIR \
            -w /workspace --privileged $IMAGE_NAME
      - name: Check GPU
        run: |
          docker exec ${{ env.container_name }} nvidia-smi
      - name: Install PaddleFormers
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          set -x
          source /root/proxy
          wget -q --tries=5 --no-proxy --no-check-certificate https://paddle-github-action.bj.bcebos.com/PaddleFormers/PR/${PR_ID}/${COMMIT_ID}/${BRANCH}/paddleformers.tar.gz
          mkdir PaddleFormers && cd PaddleFormers
          tar -xf ../paddleformers.tar.gz --strip-components=1
          git config --global --add safe.directory /workspace/PaddleFormers
          git checkout ${BRANCH}
          '
      - name: Change python version
        run: |
          docker exec -i -e "python_version=${{ env.python_version }}" ${{ env.container_name }} /bin/bash <<-DOCKER_EOF
          echo "Change python version to $python_version"
          set -e
          cp ${{ github.workspace }}/../../../Miniconda3-latest-Linux-x86_64.sh /tmp/miniconda.sh
          bash /tmp/miniconda.sh -b -p /opt/conda
          export PATH=/opt/conda/bin:$PATH
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
          conda create -n py_$python_version python=$python_version -y
          . /opt/conda/etc/profile.d/conda.sh
          conda activate py_$python_version
          python --version
          DOCKER_EOF
      - name: Test
        id: test
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -c '
          . /opt/conda/etc/profile.d/conda.sh
          conda activate py_$python_version
          python --version
          ldconfig
          mkdir -p /root/.cache/pip
          pip cache dir
          set -e
          rm -rf /root/.cache/aistudio/
          cd /workspace/PaddleFormers && git config --global --add safe.directory $PWD
          source /root/proxy
          source ${{ github.workspace }}/../../../AISTUDIO_ACCESS_TOKEN
          bash -x scripts/unit_test/ci_unittest.sh ${paddle_whl} false ${PYTEST_EXECUTE_FLAG_FILE}
          '
      - name: Display Test Summary
        if: always()
        run: |
          file_success=${{ github.workspace }}/PaddleFormers/unittest_logs/unittest.log
          file_failed=${{ github.workspace }}/PaddleFormers/unittest_logs/unittest_FAIL.log
          if [[ "${{ steps.test.outcome }}" == "success" ]]; then
            echo "Test passed successfully"
            tail -n 1 ${file_success} || true
          else
            echo "Test failed with status: ${{ steps.test.outcome }}"
            grep "^FAILED tests" ${file_failed} | awk '{print $2}' | sort -u || true
          fi
      - name: Upload Products
        if: always()
        env:
          home_path: ${{ github.workspace }}/../../..
          bos_file: ${{ github.workspace }}/../../../bos/BosClient.py
          java_file: ${{ github.workspace }}/../../../jdk1.8.0_351
          allure_file: ${{ github.workspace }}/../../../allure-2.19.0/bin/allure
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -c '
          source /root/proxy_huggingface
          python -m pip install bce-python-sdk==0.8.74 -i https://pypi.org/simple
          if [ ! -f "${{ env.bos_file }}" ]; then
            wget -q --no-proxy -O ${{ env.home_path }}/bos_new.tar.gz https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
            mkdir ${{ env.home_path }}/bos
            tar xf ${{ env.home_path }}/bos_new.tar.gz -C ${{ env.home_path }}/bos
          fi
          bos_prefix="${PR_ID}/${COMMIT_ID}"
          if [ -f "${PYTEST_EXECUTE_FLAG_FILE}" ]; then
            echo "PYTEST_EXECUTE_FLAG_FILE found, uploading coverage.xml."
            cd /workspace/PaddleFormers
            python ${{ env.bos_file }} coverage.xml paddle-github-action/PR/PaddleFormers/ci-unittest-gpu/${bos_prefix}/logs
            echo "cov-report: https://paddle-github-action.bj.bcebos.com/PR/PaddleFormers/ci-unittest-gpu/${bos_prefix}/logs/coverage.xml"
          else
            echo "PYTEST_EXECUTE_FLAG_FILE not found, skipping coverage.xml upload."
          fi
          cd /workspace/PaddleFormers/unittest_logs
          for FILE in /workspace/PaddleFormers/unittest_logs/*; do
            file=$(basename "$FILE")
            python ${{ env.bos_file }} $file paddle-github-action/PR/PaddleFormers/ci-unittest-gpu/${bos_prefix}/logs
            echo "$file: https://paddle-github-action.bj.bcebos.com/PR/PaddleFormers/ci-unittest-gpu/${bos_prefix}/logs/$file"
          done
          '
      - name: Terminate And Delete the Container
        if: always()
        run: |
          docker rm -f ${{ env.container_name }} 2>/dev/null || true
  coverage_check:
    name: Coverage Upload And Check
    needs: [multi-card_test, single_card_test, integration-test-a100, integration-test-H20-single-card, integration-test-H20-multi-card, check-bypass]
    if: ${{ always() && needs.check-bypass.outputs.can-skip != 'true' && needs.single_card_test.result != 'skipped' }}
    runs-on:
      group: APPROVAL
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    env:
      GITHUB_REPO_NAME: ${{ github.repository }}
    steps:
      - name: Cleanup
        run: |
          rm -rf * .[^.]*
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: coverage file download
        shell: bash
        run: |
          coverage_configs="
          multi_coverage.xml:multi-card/coverage.xml
          single_coverage.xml:single-card/coverage.xml
          h20_multi_coverage.xml:h20-multi/coverage.xml
          h20_single_coverage.xml:h20-single/coverage.xml
          a100_coverage.xml:a100/coverage.xml
          "
          base_url="https://paddle-github-action.bj.bcebos.com/${GITHUB_REPO_NAME}/pull/${PR_ID}/${COMMIT_ID}"

          echo "$coverage_configs" | while IFS= read -r config; do
            if [ -n "$config" ]; then
                filename="${config%%:*}"
                filepath="${config#*:}"
                wget "${base_url}/${filepath}" -O "$filename" --no-proxy
            fi
          done
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD  --unified=0 > diff.txt
          echo "=== DIFF FILE ==="
          cat diff.txt
          echo "================="
          python -m pip install diff-cover
          echo "=== 覆盖率文件 ==="
          ls *.xml
          echo "================="
          COVERAGE_EXIT_CODE=0
          diff-cover *.xml --diff-file=diff.txt --fail-under=90 || COVERAGE_EXIT_CODE=9
          exit ${COVERAGE_EXIT_CODE}
      - name: Check full coverage
        if: always()
        run: |
          echo "=== 全量覆盖率检查 ==="
          python -m pip install coverage==7.13.0

          # 定义所有覆盖率文件
          COVERAGE_FILES=(
            "multi_coverage.xml"
            "single_coverage.xml"
            "h20_multi_coverage.xml"
            "h20_single_coverage.xml"
            "a100_coverage.xml"
          )

          # 检查哪些文件存在
          EXISTING_FILES=()
          for FILE in "${COVERAGE_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              EXISTING_FILES+=("$FILE")
            fi
          done

          echo "找到 ${#EXISTING_FILES[@]} 个覆盖率文件"

          # 使用脚本合并 XML 覆盖率文件并输出全量覆盖率报告
          python scripts/fleet_ci/merge_and_check_coverage.py "${EXISTING_FILES[@]}" --report-only
      - name: filter coverage files and remove backup files
        if: always()
        run: |
          echo "=== CHECKING COVERAGE FILES ==="

          COVERAGE_FILES=(
            "multi_coverage.xml"
            "single_coverage.xml"
            "h20_multi_coverage.xml"
            "h20_single_coverage.xml"
            "a100_coverage.xml"
          )

          for COVERAGE_FILE in "${COVERAGE_FILES[@]}"; do
            python scripts/fleet_ci/filter_coverage.py "$COVERAGE_FILE" diff.txt
            BACKUP_FILE="${COVERAGE_FILE}.backup"
            if [ -f "$BACKUP_FILE" ]; then
              rm -f "$BACKUP_FILE"
              echo "Removed backup: $BACKUP_FILE"
            fi
          done
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: |
            ./multi_coverage.xml,
            ./single_coverage.xml,
            ./h20_multi_coverage.xml,
            ./h20_single_coverage.xml,
            ./h20_qwen_coverage.xml,
            ./a100_coverage.xml
          flags: coverage_combine
          name: "${{ env.TASK }}-${{ github.run_id }}"
          fail_ci_if_error: true
          use_oidc: true
          verbose: true
