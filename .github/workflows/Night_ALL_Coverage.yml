name: Night-ALL-Coverage

on:

  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: night-all-coverage-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

env:
  COMMIT_ID: ${{ github.sha }}
  TASK: PaddleFormers-Night-Coverage
  ci_scripts: /workspace/PaddleFormers/scripts/unit_test
  BRANCH: ${{ github.ref_name }}
  CI_name: night-all-coverage
  no_proxy: "localhost,bj.bcebos.com,su.bcebos.com,bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"

defaults:
  run:
    shell: bash

jobs:
  night-coverage:
    name: night-all-coverage
    runs-on: ${{ 'ernie-8gpu' }}
    steps:
      - name: Determine Image Name
        run: |
          echo "IMAGE_NAME=ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda126-dev-latest" >> "$GITHUB_ENV"

      - name: Run Container
        env:
          work_dir: ${{ github.workspace }}
          FLAGS_dynamic_static_unified_comm: "True"
          python_version: "3.10"
          PIP_CACHE_DIR: /root/.cache/pip
          paddle_whl: https://paddle-qa.bj.bcebos.com/paddle-pipeline/Develop-TagBuild-Training-Linux-Gpu-Cuda12.6-Cudnn9.5-Trt10.5-Mkl-Avx-Gcc11-SelfBuiltPypiUse/latest/paddlepaddle_gpu-0.0.0-cp310-cp310-linux_x86_64.whl
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> "$GITHUB_ENV"
          echo "Workspace path: ${{ github.workspace }}"
          DOCKER_VER=$(docker version --format '{{.Server.Version}}' | cut -d. -f1,2)
          if (( $(echo "$DOCKER_VER < 19.03" | bc -l) )); then
            GPU_OPTION="--runtime=nvidia"
          else
            GPU_OPTION="--gpus all"
          fi
          echo "DOCKER_VER=${DOCKER_VER}"
          echo "GPU_OPTION=${GPU_OPTION}"
          docker run -d -t ${GPU_OPTION} --name ${container_name} --net=host -v /dev/shm:/dev/shm --shm-size=32G \
            -v $work_dir/../../..:$work_dir/../../.. \
            -v $work_dir:/workspace \
            -v /home/.cache/:/root/.cache/ \
            -v /home/paddle-1/models/:/home/models/ \
            -e PF_HOME=/home/models/ \
            -e "BRANCH=$BRANCH" \
            -e "COMMIT_ID=$COMMIT_ID" \
            -e "work_dir=$work_dir" \
            -e "ci_scripts=$ci_scripts" \
            -e "no_proxy=$no_proxy" \
            -e "CI_JOB_NAME=$CI_JOB_NAME" \
            -e "paddle_whl=$paddle_whl" \
            -e "FLAGS_dynamic_static_unified_comm=$FLAGS_dynamic_static_unified_comm" \
            -e "python_version=$python_version" \
            -e "HF_PROXY_PATH=$work_dir/../../../proxy_huggingface" \
            -e "AISTUDIO_PROXY_PATH=$work_dir/../../../proxy_aistudio" \
            -e "HF_DATASETS_CACHE=$work_dir/../../../paddlenlp/huggingface/datasets" \
            -e "TRANSFORMERS_CACHE=$work_dir/../../../paddlenlp/huggingface" \
            -e PIP_CACHE_DIR \
            -w /workspace --privileged $IMAGE_NAME

      - name: Download Code
        run: |
          docker exec -t $container_name /bin/bash -c '
            rm -rf * .[^.]*
            echo "Downloading PaddleFormers.tar"
            wget -q --no-proxy https://paddle-qa.bj.bcebos.com/CodeSync/develop/PaddleFormers.tar --no-check-certificate
            echo "Extracting PaddleFormers.tar"
            rm -rf PaddleFormers
            tar xf PaddleFormers.tar && rm -rf PaddleFormers.tar
            source $work_dir/../../../proxy
            cd PaddleFormers
            git config --global user.name "PaddleCI"
            git config --global user.email "paddle_ci@example.com"
            git pull
            git submodule update --init --recursive --force
            echo "Not in a pull_request event. Running nightly full coverage on default branch."
            git log --pretty=oneline -10
          '

      - name: Run Tests with Coverage
        run: |
          docker exec -t $container_name /bin/bash -c '
          ldconfig
          mkdir -p /root/.cache/pip
          pip cache dir
          set -e
          rm -rf /root/.cache/aistudio/
          cd /home/models/my_packages && dpkg -i *.deb
          cd /workspace/PaddleFormers && git config --global --add safe.directory $PWD
          source $work_dir/../../../proxy
          source $work_dir/../../../AISTUDIO_ACCESS_TOKEN
          echo "work_dir = ${work_dir}"
          cp -r ${work_dir}/../../../models ./models
          echo "Check whether the local model file exists:"
          ls -l ./models

          export nlp_dir=/workspace/PaddleFormers
          export log_path=/workspace/PaddleFormers/unittest_logs
          mkdir -p ${log_path}

          # Install requirements (same as ci_unittest.sh)
          python -m pip config --user set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          python -m pip config --user set global.trusted-host pypi.tuna.tsinghua.edu.cn
          python -m pip uninstall paddlepaddle paddlepaddle_gpu paddlefleet -y
          python -m pip install -U --no-cache-dir transformers
          python setup.py bdist_wheel > /dev/null
          pip install "$(ls -t dist/*.whl | head -1)[paddlefleet]" -i https://pypi.tuna.tsinghua.edu.cn/simple --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/cu126/ --extra-index-url https://www.paddlepaddle.org.cn/packages/nightly/cu126/
          pip install -r tests/requirements.txt
          python -c "import paddle; print(paddle.__version__); print(paddle.version.show())" >> ${log_path}/commit_info.txt
          python -c "from paddleformers import __version__; print(\"paddleformers version:\", __version__)" >> ${log_path}/commit_info.txt
          python -c "import paddleformers; print(\"paddleformers commit:\", paddleformers.version.commit)" >> ${log_path}/commit_info.txt

          # Set environment (same as ci_unittest.sh)
          export NVIDIA_TF32_OVERRIDE=0
          export FLAGS_cudnn_deterministic=1
          export FLAGS_use_cuda_managed_memory=true
          export HF_ENDPOINT=https://hf-mirror.com
          export PYTHONFAULTHANDLER=1

          cd ${nlp_dir}
          echo "Running nightly full coverage test"
          unset http_proxy && unset https_proxy
          set +e

          # Run pytest with coverage - strictly aligned with ci_unittest.sh coverage method
          # --cov-report= (empty) ensures .coverage data file is kept for later lcov export
          DOWNLOAD_SOURCE=aistudio WAIT_UNTIL_DONE=True PADDLEFORMERS_TESTING=True \
          PYTHONPATH=$(pwd) \
          COVERAGE_SOURCE=paddleformers \
          timeout 15m \
          python -m pytest -v -s -n 4 \
              --dist no \
              --maxfail=10 \
              --retries 3 --retry-delay 1 \
              --timeout 200 --durations 20 \
              --alluredir=result \
              --cov=paddleformers \
              --cov-report= \
              --cov-report=xml:coverage.xml > ${log_path}/unittest.log 2>&1
          exit_code=$?

          echo "Pytest exit code: ${exit_code}"
          tail -n 20 ${log_path}/unittest.log

          # Generate night_coverage.txt summary
          commit_info=$(git log --format=fuller | head -1 | awk "{print \$2}")
          touch /workspace/PaddleFormers/night_coverage.txt
          echo "commit:${commit_info}" >> /workspace/PaddleFormers/night_coverage.txt
          echo "date:$(date +%Y-%m-%d)" >> /workspace/PaddleFormers/night_coverage.txt

          # Extract coverage summary from coverage.xml
          if [ -f coverage.xml ]; then
            line_rate=$(grep -oP "line-rate=\"[^\"]*\"" coverage.xml | head -1)
            echo "coverage_${line_rate}" >> /workspace/PaddleFormers/night_coverage.txt
            echo "Coverage XML generated successfully."
          else
            echo "coverage_line-rate=N/A" >> /workspace/PaddleFormers/night_coverage.txt
            echo "WARNING: coverage.xml not found!"
          fi

          # Generate coverage-full.info using coverage lcov (strictly aligned with coverage data)
          # coverage.py stores data in .coverage file, pytest-cov creates it automatically
          mkdir -p /workspace/PaddleFormers/build
          if [ -f .coverage ]; then
            python -m coverage lcov -o /workspace/PaddleFormers/build/coverage-full.info
            echo "coverage-full.info generated successfully."
          else
            echo "WARNING: .coverage data file not found, trying to generate from coverage.xml"
            # If .coverage not available, use coverage.xml as the full report
            cp coverage.xml /workspace/PaddleFormers/build/coverage-full.xml 2>/dev/null || true
          fi

          # Append test result summary to night_coverage.txt
          if [ ${exit_code} -eq 0 ]; then
            echo "test_result:SUCCESS" >> /workspace/PaddleFormers/night_coverage.txt
          else
            echo "test_result:FAIL(exit_code=${exit_code})" >> /workspace/PaddleFormers/night_coverage.txt
          fi

          echo "=== night_coverage.txt content ==="
          cat /workspace/PaddleFormers/night_coverage.txt
          '

      - name: Upload Coverage Products to BOS
        if: always()
        env:
          home_path: ${{ github.workspace }}/../../..
          bos_file: ${{ github.workspace }}/../../../bos/BosClient.py
        run: |
          docker exec -t $container_name /bin/bash -c '
          if [ ! -f "${{ env.bos_file }}" ]; then
            wget -q --no-proxy -O ${{ env.home_path }}/bos_new.tar.gz https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
            mkdir -p ${{ env.home_path }}/bos
            tar xf ${{ env.home_path }}/bos_new.tar.gz -C ${{ env.home_path }}/bos
          fi

          coverage_tag=$(date +%Y-%m-%d)

          # Upload night_coverage.txt
          cd /workspace/PaddleFormers
          if [ -f night_coverage.txt ]; then
            echo "Uploading night_coverage.txt"
            python ${{ env.bos_file }} night_coverage.txt paddle-github-action/night/coverage/${coverage_tag}
            echo "night_coverage.txt: https://paddle-github-action.bj.bcebos.com/night/coverage/${coverage_tag}/night_coverage.txt"
          else
            echo "WARNING: night_coverage.txt not found, skipping upload."
          fi

          # Upload coverage-full.info
          if [ -f build/coverage-full.info ]; then
            echo "Uploading coverage-full.info"
            cd /workspace/PaddleFormers/build
            python ${{ env.bos_file }} coverage-full.info paddle-github-action/night/coverage/${coverage_tag}/build
            echo "coverage-full.info: https://paddle-github-action.bj.bcebos.com/night/coverage/${coverage_tag}/build/coverage-full.info"
          else
            echo "WARNING: coverage-full.info not found, skipping upload."
          fi

          # Upload coverage.xml as additional artifact
          cd /workspace/PaddleFormers
          if [ -f coverage.xml ]; then
            echo "Uploading coverage.xml"
            python ${{ env.bos_file }} coverage.xml paddle-github-action/night/coverage/${coverage_tag}
            echo "coverage.xml: https://paddle-github-action.bj.bcebos.com/night/coverage/${coverage_tag}/coverage.xml"
          fi

          # Upload unittest logs
          if [ -d unittest_logs ]; then
            cd /workspace/PaddleFormers/unittest_logs
            for FILE in /workspace/PaddleFormers/unittest_logs/*; do
              file=$(basename "$FILE")
              python ${{ env.bos_file }} $file paddle-github-action/night/coverage/${coverage_tag}/logs
              echo "$file: https://paddle-github-action.bj.bcebos.com/night/coverage/${coverage_tag}/logs/$file"
            done
          fi
          '

      - name: Terminate And Delete the Container
        if: always()
        run: |
          docker rm -f $container_name 2>/dev/null || true
