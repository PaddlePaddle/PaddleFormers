name: Clone

on:
  workflow_call:
    inputs:
      clone_dir:
        type: string
        required: false
        default: 'develop'
      is_pr:
        type: string
        required: false
        default: 'false'
      ref:
        required: true
        type: string
      commit:
        type: string
        required: false
      submodule:
        type: string
        required: false
        default: 'recursive'

permissions: read-all

defaults:
  run:
    shell: bash

env:
  PR_ID: ${{ github.event.pull_request.number || '0' }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  ci_scripts: ${{ github.workspace }}/ci
  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}

jobs:
  clone:
    name: Clone PaddleFormers
    if: ${{ github.repository_owner == 'PaddlePaddle' }}
    runs-on:
      group: HK-Clone
    steps:
      - name: Clone PaddleFormers
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: ${{ inputs.submodule }}
          fetch-depth: 1000

      - name: Merge PR to test branch
        id: check-execution
        if: ${{ inputs.is_pr == 'true' }}
        run: |
          git submodule foreach --recursive sh -c "git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'"
          git switch ${{ github.event.pull_request.base.ref }}
          set +e
          git branch -D test
          set -e
          git gc
          git switch -c test
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr
          git merge --no-ff pr
          git submodule update --init
          git branch -d pr

      - name: Download bos client
        env:
          home_path: "/home/paddle/actions-runner/"
          bos_file: "/home/paddle/actions-runner/bos/BosClient.py"
        run: |
          if [ ! -f "${bos_file}" ]; then
            wget -q --no-proxy -O ${home_path}/bos_new.tar.gz https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
            mkdir ${home_path}/bos
            tar xf ${home_path}/bos_new.tar.gz -C ${home_path}/bos
          fi

      - name: Push PaddleFormers.tar.gz to bos
        env:
          AK: paddle
          SK: paddle
          bos_file: "/home/paddle/actions-runner/bos/BosClient.py"
        run: |
          cd ..
          tar -zcf PaddleFormers.tar.gz PaddleFormers
          echo "::group::Install bce-python-sdk"
          python -m pip install bce-python-sdk==0.8.74
          echo "::endgroup::"
          if [ -n "${{ inputs.commit }}" ]; then
            python ${bos_file} PaddleFormers.tar.gz paddle-github-action/PaddleFormers/${{ inputs.clone_dir }}/${PR_ID}/${{ inputs.commit }}
          else
            python ${bos_file} PaddleFormers.tar.gz paddle-github-action/PaddleFormers/${{ inputs.clone_dir }}/${PR_ID}/${COMMIT_ID}
          fi

      - name: Clean environment
        if: always()
        run: |
          cd ${{ github.workspace }}
          rm -rf * .[^.]*