name: Check Requirements Changes

on:
  pull_request:
    paths:
      - 'requirements.txt'

jobs:
  review_request:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Detect changes in requirements.txt
        id: check_diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }} -- requirements.txt > diff.txt
          if [ -s diff.txt ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for approved reviews and add reviewers if needed
        if: steps.check_diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const reviewers = [
              'nepeplwu',
              'lugimzzz',
              'zjjlivein'
            ];
            
            try {
              // Get all reviews for the PR
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              
              // Check if there's at least one approved review
              const hasApproved = reviews.some(review => review.state === 'APPROVED');
              
              if (hasApproved) {
                console.log('PR already has at least one approved review. Skipping reviewer request.');
                return;
              }
              
              // Get existing review requests
              const { data: reviewRequests } = await github.rest.pulls.listRequestedReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              
              // Filter out reviewers that are already requested
              const existingReviewers = reviewRequests.users.map(user => user.login);
              const newReviewers = reviewers.filter(reviewer => !existingReviewers.includes(reviewer));
              
              if (newReviewers.length > 0) {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  reviewers: newReviewers,
                });
                console.log(`Requested review from: ${newReviewers.join(', ')}`);
              } else {
                console.log('All reviewers have already been requested');
              }
            } catch (error) {
              console.error('Error checking reviews or requesting reviewers:', error);
              // Don't fail the workflow if reviewers can't be added
              // This allows rerun to succeed even if reviewers are already added
            }

