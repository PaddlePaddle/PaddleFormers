name: Check Requirements Changes

on:
  pull_request:
    paths:
      - 'requirements.txt'

permissions:
  contents: read
  pull-requests: write

jobs:
  review_request:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if requirements.txt changed
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }} | grep -q '^requirements.txt$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Request reviewers if needed
        if: |
          steps.diff.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const reviewers = ['nepeplwu', 'lugimzzz', 'zjjlivein'];

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (reviews.some(r => r.state === 'APPROVED')) {
              console.log('Already approved, skip.');
              return;
            }

            const { data: requested } =
              await github.rest.pulls.listRequestedReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });

            const existing = requested.users.map(u => u.login);
            const toAdd = reviewers.filter(r => !existing.includes(r));

            if (toAdd.length === 0) {
              console.log('No new reviewers to add.');
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers: toAdd,
            });

            console.log('Requested reviewers:', toAdd);