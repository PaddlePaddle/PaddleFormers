name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@formers')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@formers')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@formers')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@formers') || contains(github.event.issue.title, '@formers')))
    runs-on: paddle-bot
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup custom Claude Code
        run: | 
          mkdir -p /home/paddle-1/actions-runner/_work/_actions/anthropics/claude-code-action/v1/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl/claude
          ln -sf /home/paddle-1/.baidu-cc/baidu-cc/bin/claude /home/paddle-1/actions-runner/_work/_actions/anthropics/claude-code-action/v1/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64-musl/claude

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          anthropic_base_url: ${{ secrets.ANTHROPIC_BASE_URL }}

          # Use pre-installed Claude CLI on paddle-bot runner
          path_to_claude_code_executable: /home/paddle-1/.baidu-cc/baidu-cc/bin/ducc

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--print'
          trigger_phrase: '@formers'

