name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@formers')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@formers')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@formers')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@formers') || contains(github.event.issue.title, '@formers')))
    runs-on: paddle-bot
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Debug Claude binary
        run: |
          ls -l /home/paddle-1/.baidu-cc/baidu-cc/bin/
          file /home/paddle-1/.baidu-cc/baidu-cc/bin/claude
          ldd /home/paddle-1/.baidu-cc/baidu-cc/bin/claude || true
          /home/paddle-1/.baidu-cc/baidu-cc/bin/claude --version || true
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          
          path_to_claude_code_executable: /home/paddle-1/.baidu-cc/baidu-cc/bin/claude

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--print'
          trigger_phrase: '@formers'
          bot_name: formers[bot]
          label_trigger: formers
