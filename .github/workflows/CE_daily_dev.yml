          bash -x PaddleFormers/tests/integration_test/qwen3vl_sft.sh tp8 a100
          exit_code=$?
          if [ ${exit_code} -ne 0 ]; then
            export case_name="qwen3vl_sft_a100_tp8_multi_card"
            bash PaddleFormers/scripts/fleet_ci/check_ce_precision.sh $case_name $BASE_NAME
          else
            echo -e "\033[32mIntegration test succeeded: Qwen vl sft.\033[0m"
          fi
          '
 
      - name: Qwen vl lora
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        timeout-minutes: 5
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -c '
          source /root/proxy
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda activate python${PYTHON_VERSION}
          export COVERAGE_FILE=/workspace/PaddleFormers/coveragedata/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFormers/scripts/fleet_ci/.coveragerc
          bash -x PaddleFormers/tests/integration_test/qwen3vl_lora.sh a100
          exit_code=$?
          if [ ${exit_code} -ne 0 ]; then
            export case_name="qwen3vl_lora_a100_multi_card"
            bash PaddleFormers/scripts/fleet_ci/check_ce_precision.sh $case_name $BASE_NAME
          else
            echo -e "\033[32mIntegration test succeeded: Qwen vl lora.\033[0m"
          fi
          '
 
      - name: Qwen vl moe
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        timeout-minutes: 10
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -c '
          source /root/proxy
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda activate python${PYTHON_VERSION}
          export COVERAGE_FILE=/workspace/PaddleFormers/coveragedata/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFormers/scripts/fleet_ci/.coveragerc
          bash -x PaddleFormers/tests/integration_test/qwen3vl_sft.sh moe a100
          exit_code=$?
          if [ ${exit_code} -ne 0 ]; then
            export case_name="qwen3vl_sft_a100_moe_multi_card"
            bash PaddleFormers/scripts/fleet_ci/check_ce_precision.sh $case_name $BASE_NAME
          else
            echo -e "\033[32mIntegration test succeeded: Qwen vl moe.\033[0m"
          fi
          '
 
      - name: A100 Coverage Upload to BOS
        if: ${{ always() && matrix.python == '3.12' && matrix.cuda == '12.9' }}
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xce '
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda activate python${{ matrix.python }}
          export COVERAGE_FILE=/workspace/PaddleFormers/coveragedata/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFormers/scripts/fleet_ci/.coveragerc
          ls -a /workspace/PaddleFormers/coveragedata
          coverage combine
          coverage xml -o /workspace/PaddleFormers/coveragedata/coverage.xml
          coverage report -m
          wget -q --no-proxy --no-check-certificate \
            https://paddle-qa.bj.bcebos.com/CodeSync/develop/PaddlePaddle/PaddleTest/tools/bos_tools.py \
            -O bos_tools.py
          push_file=$(realpath bos_tools.py)
          cp /workspace/PaddleFormers/coveragedata/coverage.xml coverage.xml
          target_path="paddle-github-action/${GITHUB_REPO_NAME}/ce/${DATE}/a100"
          python ${push_file} coverage.xml ${target_path}
          '
 
      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash PaddleFormers/scripts/fleet_ci/clean_uv_cache.sh; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}
 
  coverage_check:
    name: Coverage Upload And Check
    needs: [single_card_test, multi-card_test, integration-test-H20-single-card, integration-test-a100, integration-test-H20-multi-card]
    if: always()
    runs-on:
      group: Fleet-H-single-card
    env:
      PIP_CACHE_DIR: /home/.cache/pip
      CACHE_DIR: /home/.cache
      TASK: paddleformers-CE-coverage_check
      GITHUB_REPO_NAME: ${{ github.repository }}
    steps:
      - name: Determine the runner
        run: |
          gpu_id=$(( $(echo $PWD | awk -F'/' '{print $3}' | awk -F'-' '{print $2}') - 1 ))
          echo GPU_DEVICES="$gpu_id" >> $GITHUB_ENV
          # 使用 workflow 开始时间作为统一日期，避免跨天后路径不一致
          echo DATE="$(date -d '${{ github.run_started_at }}' +%Y%m%d)" >> $GITHUB_ENV
 
      - name: Check docker image and run container
        env:
          GPU_DEVICES: ${{ env.GPU_DEVICES }}
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> $GITHUB_ENV
          docker pull $docker_image_cu129
          docker run -d -t --name ${container_name} --gpus "\"device=${GPU_DEVICES}\"" --shm-size=32G \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../..:/root \
            -v /ssd1/paddle-1/action_cache:/home/.cache \
            -v ${{ github.workspace }}:/paddle \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e CE_name \
            -e PIP_CACHE_DIR \
            -e work_dir \
            -e DATE \
            -e GITHUB_SHA="${{ github.event.pull_request.head.sha }}" \
            -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
            -e GITHUB_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            -e GITHUB_REPO_NAME="${{ github.repository }}" \
            -e GITHUB_EVENT_PULL_REQUEST_NUMBER="${{ github.event.pull_request.number }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -e repo_flag="paddlefleet" \
            -w /paddle --network host ${docker_image_cu129}
 
      - name: download code
        shell: bash
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xce '
          set -x
          source /root/proxy
          git clone https://github.com/PaddlePaddle/PaddleFormers.git
          cd PaddleFormers
          git fetch origin pull/4731/head:PR_4731 && git checkout PR_4731
          git config --global --add safe.directory /workspace/PaddleFormers
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          # git pull --no-edit origin pull/${PR_ID}/head
          '
 
      - name: Check full coverage
        if: always()
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xce '
          set -x
          cd /paddle/PaddleFormers
          coverage_configs="
          multi_coverage.xml:multi-card/coverage.xml:multi-card_test
          single_coverage.xml:single-card/coverage.xml:single_card_test
          h20_multi_coverage.xml:h20-multi/coverage.xml:integration-test-H20-multi-card
          h20_single_coverage.xml:h20-single/coverage.xml:integration-test-H20-single-card
          a100_coverage.xml:a100/coverage.xml:integration-test-a100
          "
          base_url="https://paddle-github-action.bj.bcebos.com/${GITHUB_REPO_NAME}/ce/${DATE}"
          # 记录失败的任务
          FAILED_TASKS=""
 
          echo "$coverage_configs" | while IFS= read -r config; do
            if [ -n "$config" ]; then
                filename="${config%%:*}"
                rest="${config#*:}"
                filepath="${rest%%:*}"
                task_name="${rest##*:}"
 
                if wget "${base_url}/${filepath}" -O "$filename" --no-proxy -q; then
                    echo "Downloaded: $filename from $task_name"
                    sed -i "s|<source></source>|<source>paddleformers</source>|" "$filename"
                    sed -i "s|PaddleFormers/src/|src/|" "$filename"
                    sed -i "s|PaddleFormers.src|src|" "$filename"
                else
                    echo "Warning: Failed to download ${filepath} from ${task_name}"
                    echo "$task_name" >> failed_tasks.txt
                fi
            fi
          done
          # 检查是否有失败的任务
          if [ -f failed_tasks.txt ] && [ -s failed_tasks.txt ]; then
            echo "=== 以下任务未生成覆盖率文件 ===" > coverage_missing_tasks.txt
            cat failed_tasks.txt >> coverage_missing_tasks.txt
            cat coverage_missing_tasks.txt
          else
            echo "all_success" > coverage_missing_tasks.txt
          fi
          echo "=== 全量覆盖率检查 ==="
          python -m pip install coverage==7.13.0
          # 定义所有覆盖率文件
          COVERAGE_FILES=(
            "multi_coverage.xml"
            "single_coverage.xml"
            "h20_multi_coverage.xml"
            "h20_single_coverage.xml"
            "a100_coverage.xml"
          )
          # 检查哪些文件存在
          EXISTING_FILES=()
          for FILE in "${COVERAGE_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              EXISTING_FILES+=("$FILE")
            fi
          done
 
          echo "找到 ${#EXISTING_FILES[@]} 个覆盖率文件"
 
          python scripts/fleet_ci/merge_and_check_coverage.py "${EXISTING_FILES[@]}" --report-only --output-xml 2>&1 | tee -a coverage-full.txt
          # 将失败任务信息追加到覆盖率报告中
          if [ ! "all_success" = "$(cat coverage_missing_tasks.txt)" ]; then
            echo "" >> coverage-full.txt
            echo "" >> coverage-full.txt
            echo "========================================" >> coverage-full.txt
            echo "⚠️  以下任务未生成覆盖率文件，已从统计中排除：" >> coverage-full.txt
            echo "========================================" >> coverage-full.txt
            cat coverage_missing_tasks.txt >> coverage-full.txt
            echo "" >> coverage-full.txt
            echo "注意：覆盖率统计仅包含成功运行的任务。" >> coverage-full.txt
          fi
 
          cat coverage-full.txt
          export no_proxy=localhost,bj.bcebos.com,su.bcebos.com,pypi.tuna.tsinghua.edu.cn,paddle-ci.gz.bcebos.com,0.0.0.0,baidu-int.com,aliyun.com,127.0.0.1,.baidu.com,.bcebos.com && export http_proxy=http://agent.baidu.com:8891 && export https_proxy=http://agent.baidu.com:8891
          pip install bce-python-sdk==0.8.74
          # 上传文件
          wget -q --no-proxy --no-check-certificate \
            https://paddle-qa.bj.bcebos.com/CodeSync/develop/PaddlePaddle/PaddleTest/tools/bos_tools.py \
            -O bos_tools.py
          push_file=$(realpath bos_tools.py)
          target_path="paddle-github-action/${GITHUB_REPO_NAME}/ce/${DATE}"
          python ${push_file} merged_coverage.xml ${target_path}
          python ${push_file} coverage-full.txt ${target_path}
          '
 
      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash PaddleFormers/scripts/fleet_ci/clean_uv_cache.sh; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}
