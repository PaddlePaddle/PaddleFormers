      matrix:
        include:
          - cuda: "12.9"
            python: "3.10"
          - cuda: "13.0"
            python: "3.12"
          - cuda: "12.9"
            python: "3.11"
          - cuda: "12.9"
            python: "3.12"
          - cuda: "12.9"
