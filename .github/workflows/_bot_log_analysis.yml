name: PaddleFormers Bot Log Analysis

on:
  workflow_call:
    inputs:
      ci_result:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string

jobs:
  faild-log-analysis:
    if: always() && inputs.ci_result == 'failure'
    runs-on: paddle-bot

    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write

    env:
      PATH: /home/paddle-1/.nvm/versions/node/v20.20.2/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:

      - name: Collect failed jobs
        id: get_failed_jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          failed_job_urls=$(python3 <<'PY'
          import json, urllib.request, os

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPO']
          sha = os.environ['HEAD_SHA']

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
          }

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=100",
              headers=headers,
          )

          with urllib.request.urlopen(req) as r:
              data = json.loads(r.read())

          skip = ["failed log analysis", "formers bot", "bot log analysis"]

          urls = [
              c["html_url"]
              for c in data.get("check_runs", [])
              if c.get("conclusion") == "failure"
              and not any(k in c["name"].lower() for k in skip)
          ]

          print(" ".join(urls))
          PY
          )

          echo "failed_job_urls=${failed_job_urls}" >> $GITHUB_OUTPUT

      - name: Run bot
        env:
          FAILED_JOB_URLS: ${{ steps.get_failed_jobs.outputs.failed_job_urls }}
          TASK_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          echo "TASK_ID=$TASK_ID" >> $GITHUB_ENV

          cd /home/paddle-1/

          PROMPT="Analyze failed CI logs: ${FAILED_JOB_URLS}"

          python formers_bot.py \
            --prompt "$PROMPT" \
            --task-id "$TASK_ID"

      - name: Upload summary
        id: summary
        if: always()
        run: |
          RESULT_FILE=/tmp/bot_results/bot_result_${TASK_ID}.md

          echo "## PaddleFormers Bot Log Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE" >> $GITHUB_STEP_SUMMARY
            echo "has_result=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No analysis result generated." >> $GITHUB_STEP_SUMMARY
            echo "has_result=false" >> $GITHUB_OUTPUT
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 See PR comment for continuously updated history" >> $GITHUB_STEP_SUMMARY

      - name: Update PR comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HAS_RESULT: ${{ steps.summary.outputs.has_result }}
        run: |
          python3 <<'PY'
          import os, json, urllib.request, urllib.error

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]
          run_id = os.environ["RUN_ID"]
          attempt = os.environ["RUN_ATTEMPT"]
          has_result = os.environ["HAS_RESULT"] == "true"

          marker = "<!-- paddleformers-bot-analysis -->"

          task_id = f"{run_id}-{attempt}"
          result_file = f"/tmp/bot_results/bot_result_{task_id}.md"

          if has_result and os.path.exists(result_file):
              body = open(result_file).read()
          else:
              body = "⚠️ No analysis result generated."

          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          comment = f"""{marker}

          ## PaddleFormers Bot Log Analysis

          > Run #{run_id} · Attempt {attempt}

          🔗 {run_url}

          {body}

          ---
          <sub>Auto-updated on rerun</sub>
          """

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          }

          def request(method, url, payload=None):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode() if payload else None,
                  headers=headers,
                  method=method,
              )

              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          base = f"https://api.github.com/repos/{repo}"

          comments = request(
              "GET",
              f"{base}/issues/{pr}/comments?per_page=100"
          )

          existing = next(
              (c["id"] for c in comments if marker in c["body"]),
              None
          )

          if existing:
              request(
                  "PATCH",
                  f"{base}/issues/comments/{existing}",
                  {"body": comment}
              )
          else:
              request(
                  "POST",
                  f"{base}/issues/{pr}/comments",
                  {"body": comment}
              )

          print("comment updated")
          PY
      - name: Add PR check annotation
        if: always()
        run: |
          echo "::notice title=PaddleFormers Bot::Click Summary tab to view log analysis."