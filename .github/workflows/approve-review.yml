name: Check Files Need Approval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'requirements.txt'
      - 'paddleformers/trainer/training_args.py'
      - 'paddleformers/cli/hparams/**'
  pull_request_review:
    types: [submitted]

jobs:
  check-review:
    runs-on: ernie-cpu
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: .
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto merge base into PR branch if outdated
        id: auto_merge
        run: |
          git fetch origin ${{ github.base_ref }}

          BEHIND=$(git rev-list HEAD..origin/${{ github.base_ref }} --count)
          echo "Commits behind base: $BEHIND"

          if [ "$BEHIND" -gt "0" ]; then
            echo "PR is outdated ($BEHIND commits), merging base into PR branch..."
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git merge origin/${{ github.base_ref }} --no-edit
            git push origin HEAD:${{ github.head_ref }}
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "PR is up to date, skip merge"
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed sensitive files
        id: check_diff
        run: |
          MERGE_BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          echo "Merge base: $MERGE_BASE"

          ALL_CHANGED=$(git diff $MERGE_BASE --name-only)

          # 检查 requirements.txt
          if echo "$ALL_CHANGED" | grep -q '^requirements\.txt$'; then
            echo "requirements_changed=true" >> $GITHUB_OUTPUT
          else
            echo "requirements_changed=false" >> $GITHUB_OUTPUT
          fi

          # 检查 training_args.py / hparams/*
          if echo "$ALL_CHANGED" | grep -qE \
            '^paddleformers/trainer/training_args\.py$|^paddleformers/cli/hparams/'; then
            echo "training_changed=true" >> $GITHUB_OUTPUT
          else
            echo "training_changed=false" >> $GITHUB_OUTPUT
          fi

          echo "--- Changed files ---"
          echo "$ALL_CHANGED"

      - name: Check approval for requirements.txt
        if: steps.check_diff.outputs.requirements_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              "zjjlivein",
              "From00"
            ];
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const approved = new Set();
            for (const r of reviews) {
              if (required.includes(r.user.login) && r.state === "APPROVED") {
                approved.add(r.user.login);
              }
            }
            if (approved.size === 0) {
              core.setFailed(
                `requirements.txt changed: need approval from one of ${required.join(", ")}`
              );
            } else {
              core.info(`[requirements.txt] Approved by: ${Array.from(approved).join(", ")}`);
            }

      - name: Check approval for training_args / hparams
        if: steps.check_diff.outputs.training_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              "From00"
            ];
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const approved = new Set();
            for (const r of reviews) {
              if (required.includes(r.user.login) && r.state === "APPROVED") {
                approved.add(r.user.login);
              }
            }
            if (approved.size === 0) {
              core.setFailed(
                `training_args.py / hparams/* changed: need approval from one of ${required.join(", ")}`
              );
            } else {
              core.info(`[training_args/hparams] Approved by: ${Array.from(approved).join(", ")}`);
            }

      - name: All checks passed
        if: steps.check_diff.outputs.requirements_changed == 'false' && steps.check_diff.outputs.training_changed == 'false'
        run: |
          echo "No sensitive files changed, skip approval check"
