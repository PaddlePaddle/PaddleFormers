name: Check Files Need Approval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'requirements.txt'
      - 'paddleformers/trainer/training_args.py'
      - 'paddleformers/cli/hparams/**'
  pull_request_review:
    types: [submitted]

jobs:
  check-review:
    runs-on: ernie-cpu

    steps:
      - name: Shallow clone via PR merge commit
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          fi
          echo "BASE_REF=$BASE_REF" >> $GITHUB_ENV

          PR_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$PR_SHA" ]; then
            PR_SHA="${{ github.sha }}"
          fi
          echo "PR_SHA=$PR_SHA" >> $GITHUB_ENV

          REPO_DIR=/home/paddle-1/runner_work/PaddleFormers
          rm -rf $REPO_DIR
          mkdir -p $REPO_DIR

          GIT_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # 初始化 repo，不 clone 任何分支
          git init $REPO_DIR
          cd $REPO_DIR
          git remote add origin $GIT_URL

          # 只拉 PR head commit + base 分支，各 depth=50
          git fetch --depth=50 origin $PR_SHA
          git fetch --depth=50 origin $BASE_REF

          # checkout 到 PR 的 head commit
          git checkout $PR_SHA

          echo "REPO_DIR=$REPO_DIR" >> $GITHUB_ENV

      - name: Auto merge base into PR branch if outdated
        id: auto_merge
        run: |
          cd $REPO_DIR
          HEAD_REF="${{ github.head_ref }}"
          if [ -z "$HEAD_REF" ]; then
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
          fi

          BEHIND=$(git rev-list HEAD..origin/$BASE_REF --count)
          echo "Commits behind base: $BEHIND"

          if [ "$BEHIND" -gt "0" ]; then
            echo "PR is outdated ($BEHIND commits), merging base into PR branch..."
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git merge origin/$BASE_REF --no-edit
            git push origin HEAD:$HEAD_REF
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "PR is up to date, skip merge"
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed sensitive files
        id: check_diff
        run: |
          cd $REPO_DIR
          MERGE_BASE=$(git merge-base HEAD origin/$BASE_REF)
          echo "Merge base: $MERGE_BASE"

          ALL_CHANGED=$(git diff $MERGE_BASE --name-only)

          if echo "$ALL_CHANGED" | grep -q '^requirements\.txt$'; then
            echo "requirements_changed=true" >> $GITHUB_OUTPUT
          else
            echo "requirements_changed=false" >> $GITHUB_OUTPUT
          fi

          if echo "$ALL_CHANGED" | grep -qE \
            '^paddleformers/trainer/training_args\.py$|^paddleformers/cli/hparams/'; then
            echo "training_changed=true" >> $GITHUB_OUTPUT
          else
            echo "training_changed=false" >> $GITHUB_OUTPUT
          fi

          echo "--- Changed files ---"
          echo "$ALL_CHANGED"

      - name: Check approval for requirements.txt
        if: steps.check_diff.outputs.requirements_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const required = ["zjjlivein", "From00"];
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request
                ? context.payload.pull_request.number
                : context.payload.review.pull_request_url.split("/").pop(),
            });
            const approved = new Set();
            for (const r of reviews) {
              if (required.includes(r.user.login) && r.state === "APPROVED") {
                approved.add(r.user.login);
              }
            }
            if (approved.size === 0) {
              core.setFailed(`requirements.txt changed: need approval from one of ${required.join(", ")}`);
            } else {
              core.info(`[requirements.txt] Approved by: ${Array.from(approved).join(", ")}`);
            }

      - name: Check approval for training_args / hparams
        if: steps.check_diff.outputs.training_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const required = ["From00"];
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request
                ? context.payload.pull_request.number
                : context.payload.review.pull_request_url.split("/").pop(),
            });
            const approved = new Set();
            for (const r of reviews) {
              if (required.includes(r.user.login) && r.state === "APPROVED") {
                approved.add(r.user.login);
              }
            }
            if (approved.size === 0) {
              core.setFailed(`training_args.py / hparams/* changed: need approval from one of ${required.join(", ")}`);
            } else {
              core.info(`[training_args/hparams] Approved by: ${Array.from(approved).join(", ")}`);
            }

      - name: All checks passed
        if: steps.check_diff.outputs.requirements_changed == 'false' && steps.check_diff.outputs.training_changed == 'false'
        run: echo "No sensitive files changed, skip approval check"
