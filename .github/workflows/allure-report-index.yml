name: Generate Allure Report Index

on:
  schedule:
    - cron: "0 */6 * * *"  # 每 6 小时更新一次
  workflow_dispatch:  # 允许手动触发
  push:
    branches:
      - gh-pages
    paths:
      - 'pr/**'
      - 'schedule/**'

permissions:
  contents: write
  pages: write

jobs:
  generate-index:
    name: Generate Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Generate index.html
        run: |
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PaddleFormers Allure Reports</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                padding: 20px;
                min-height: 100vh;
              }
              .container { max-width: 1400px; margin: 0 auto; }
              h1 {
                color: white;
                text-align: center;
                margin-bottom: 30px;
                font-size: 2.5em;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
              }
              .last-updated { text-align: center; color: rgba(255,255,255,0.9); margin-bottom: 30px; }
              .section {
                background: white;
                border-radius: 12px;
                padding: 25px;
                margin-bottom: 25px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.2);
              }
              .section-title {
                font-size: 1.5em;
                color: #333;
                margin-bottom: 20px;
                padding-bottom: 10px;
                border-bottom: 3px solid #667eea;
              }
              .report-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 15px;
              }
              .report-card {
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                border-radius: 8px;
                padding: 15px;
                transition: transform 0.3s;
                border: 1px solid #e0e0e0;
              }
              .report-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
              .report-card a { color: #333; text-decoration: none; display: block; }
              .report-title { font-weight: 600; color: #667eea; margin-bottom: 8px; }
              .schedule-card { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
              .pr-card { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
              .no-reports { color: #999; text-align: center; padding: 30px; font-style: italic; }
              .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
              .tab {
                padding: 10px 20px;
                background: #f0f0f0;
                border: none;
                border-radius: 5px;
                cursor: pointer;
              }
              .tab.active { background: #667eea; color: white; }
              .tab-content { display: none; }
              .tab-content.active { display: block; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🚀 PaddleFormers Allure Reports</h1>
              <div class="last-updated">最后更新: <!-- LAST_UPDATED --></div>
              <div class="tabs">
                <button class="tab active" onclick="showTab('schedule')">📅 定时任务</button>
                <button class="tab" onclick="showTab('pr')">🔖 PR 报告</button>
              </div>
              <div id="schedule" class="tab-content active">
                <div class="section">
                  <div class="section-title">📅 定时任务报告</div>
                  <div id="schedule-reports" class="report-grid"><!-- SCHEDULE_REPORTS --></div>
                </div>
              </div>
              <div id="pr" class="tab-content">
                <div class="section">
                  <div class="section-title">🔖 Pull Request 报告</div>
                  <div id="pr-reports" class="report-grid"><!-- PR_REPORTS --></div>
                </div>
              </div>
            </div>
            <script>
              function showTab(tabId) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                event.target.classList.add('active');
                document.getElementById(tabId).classList.add('active');
              }
            </script>
          </body>
          </html>
          EOF

      - name: Generate report lists
        run: |
          # 获取定时任务报告
          if [ -d "schedule" ]; then
            SCHEDULE_HTML=""
            for dir in $(ls -t schedule/ | head -50); do
              if [ -d "schedule/$dir" ]; then
                SCHEDULE_HTML="$SCHEDULE_HTML<div class=\"report-card schedule-card\"><a href=\"schedule/$dir/\"><div class=\"report-title\">📅 $dir</div><div class=\"report-meta\">定时任务报告</div></a></div>"
              fi
            done
            if [ -n "$SCHEDULE_HTML" ]; then
              sed -i "s|<!-- SCHEDULE_REPORTS -->|$SCHEDULE_HTML|g" index.html
            else
              sed -i "s|<!-- SCHEDULE_REPORTS -->|<div class=\"no-reports\">暂无定时任务报告</div>|g" index.html
            fi
          else
            sed -i "s|<!-- SCHEDULE_REPORTS -->|<div class=\"no-reports\">暂无定时任务报告</div>|g" index.html
          fi

          # 获取 PR 报告
          if [ -d "pr" ]; then
            PR_HTML=""
            for pr_dir in $(ls -t pr/ | head -100); do
              if [ -d "pr/$pr_dir" ]; then
                for commit_dir in $(ls -t pr/$pr_dir/ | head -5); do
                  if [ -d "pr/$pr_dir/$commit_dir" ]; then
                    PR_HTML="$PR_HTML<div class=\"report-card pr-card\"><a href=\"pr/$pr_dir/$commit_dir/\"><div class=\"report-title\">🔖 PR #$pr_dir</div><div class=\"report-meta\">Commit: ${commit_dir:0:8}</div></a></div>"
                  fi
                done
              fi
            done
            if [ -n "$PR_HTML" ]; then
              sed -i "s|<!-- PR_REPORTS -->|$PR_HTML|g" index.html
            else
              sed -i "s|<!-- PR_REPORTS -->|<div class=\"no-reports\">暂无 PR 报告</div>|g" index.html
            fi
          else
            sed -i "s|<!-- PR_REPORTS -->|<div class=\"no-reports\">暂无 PR 报告</div>|g" index.html
          fi

          # 更新时间
          UPDATED_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          sed -i "s|<!-- LAST_UPDATED -->|$UPDATED_TIME|g" index.html

      - name: Deploy index to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
