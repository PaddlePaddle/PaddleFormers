name: Fleet model test
on:
  pull_request:
    branches:
      - develop
    paths:
      - 'paddleformers/fleet/**'
      - 'paddleformers/transformers/**/modeling_fleet.py'
      - 'packages/paddlefleet_ops/**'
      - 'tests/fleet/**'
      - 'scripts/fleet_ci/**'
      - 'pyproject.toml'
      - '.gitmodules'
      - '.github/workflows/fleet-model-test.yml'
permissions: read-all
concurrency:
  group: ${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true
env:
  PR_ID: ${{ github.event.pull_request.number || '0' }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
  work_dir: /workspace
  PADDLE_ROOT: /workspace
  no_proxy: "bcebos.com,.bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"
  docker_image: "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda129-coverage-test"
defaults:
  run:
    shell: bash
jobs:
  check-bypass:
    name: Check bypass
    uses: ./.github/workflows/check-bypass.yml
    with:
      workflow-name: 'fleet-model-test'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
  clone:
    name: Clone PaddleFormers
    needs: check-bypass
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' }}
    uses: ./.github/workflows/_clone_linux.yml
  build:
    name: Build paddleformers and paddlefleet_ops
    needs: clone
    runs-on:
      group: GZ_BD-CPU
    env:
      TASK: paddleformers-fleet-build-${{ github.event.pull_request.number }}
      REPO_ARCHIVE_URL: ${{ needs.clone.outputs.repo_archive_url }}
      CCACHE_DIR: "/home/data/shared/.ccache/l1"
      CCACHE_SECONDARY_STORAGE: "file:///home/data/cfs/.ccache/l2"
      CCACHE_MAXSIZE: 50G
      CCACHE_LIMIT_MULTIPLE: 0.8
      UV_HTTP_TIMEOUT: 600
      PADDLE_CUDA_ARCH_LIST: "8.0;9.0;10.0;10.3"
    steps:
      - name: Run container
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          docker run -d -t --name ${container_name} \
            -v "/dev/shm:/dev/shm" \
            -v "/home/data/cfs:/home/data/cfs" \
            -v "/home/data/shared:/home/data/shared" \
            -v ${{ github.workspace }}/../../..:/root \
            -v ${{ github.workspace }}:/workspace \
            -e no_proxy -e PR_ID -e COMMIT_ID -e BRANCH -e REPO_ARCHIVE_URL \
            -e CCACHE_DIR -e CCACHE_SECONDARY_STORAGE -e CCACHE_MAXSIZE -e CCACHE_LIMIT_MULTIPLE \
            -e UV_HTTP_TIMEOUT -e PADDLE_CUDA_ARCH_LIST \
            -w /workspace --network host ${docker_image}
      - name: Build wheels
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          source /root/proxy || true
          wget -q --tries=5 --no-proxy ${REPO_ARCHIVE_URL} --no-check-certificate
          tar -xf PaddleFormers.tar.gz --strip-components=1
          rm PaddleFormers.tar.gz
          git config --global --add safe.directory /workspace
          git submodule update --init --recursive
          python -m pip install --upgrade pip
          python -m pip install uv coverage==7.6.1 bce-python-sdk==0.8.74 wrapt
          uv build --wheel --package paddlefleet-ops --out-dir dist
          uv build --wheel --package paddleformers --out-dir dist
          python -c "import paddleformers; import paddleformers.fleet"
          ls -lh dist
          '
      - name: Upload wheels to BOS
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          export AK=paddle
          export SK=paddle
          wget -q --no-proxy -O bos_new.tar.gz https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
          mkdir -p bos
          tar xf bos_new.tar.gz -C bos
          cd dist
          OPS_WHL=$(ls paddlefleet_ops-*.whl | head -n1)
          FORMERS_WHL=$(ls paddleformers-*.whl | head -n1)
          cp "${OPS_WHL}" paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl
          cp "${FORMERS_WHL}" paddleformers-0.0.1.dev-py3-none-any.whl
          python ../bos/BosClient.py paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl paddle-github-action/PaddleFormers/PR/${PR_ID}/${COMMIT_ID}
          python ../bos/BosClient.py paddleformers-0.0.1.dev-py3-none-any.whl paddle-github-action/PaddleFormers/PR/${PR_ID}/${COMMIT_ID}
          '
      - name: Cleanup
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash scripts/fleet_ci/clean_uv_cache.sh || true; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}
  single-card-test:
    name: Fleet single-card tests
    needs: [clone, build]
    runs-on:
      group: Fleet-H-single-card
    env:
      TASK: paddleformers-fleet-single-${{ github.event.pull_request.number }}
      REPO_ARCHIVE_URL: ${{ needs.clone.outputs.repo_archive_url }}
      PIP_CACHE_DIR: /home/.cache/pip
      CACHE_DIR: /home/.cache
    steps:
      - name: Determine runner GPU
        run: |
          gpu_id=$(( $(echo $PWD | awk -F'/' '{print $3}' | awk -F'-' '{print $2}') + 3 ))
          echo GPU_DEVICES="$gpu_id" >> $GITHUB_ENV
      - name: Run container
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          docker run -d -t --name ${container_name} --gpus "device=${GPU_DEVICES}" --shm-size=32G \
            -v "/dev/shm:/dev/shm" \
            -v ${{ github.workspace }}/../../..:/root \
            -v /ssd1/paddle-1/action_cache:/home/.cache \
            -v ${{ github.workspace }}:/workspace \
            -e no_proxy -e PR_ID -e COMMIT_ID -e BRANCH -e REPO_ARCHIVE_URL -e PIP_CACHE_DIR -e CACHE_DIR -e work_dir \
            -w /workspace --network host ${docker_image}
      - name: Install wheels
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          source /root/proxy || true
          wget -q --tries=5 --no-proxy ${REPO_ARCHIVE_URL} --no-check-certificate
          tar -xf PaddleFormers.tar.gz --strip-components=1
          rm PaddleFormers.tar.gz
          git config --global --add safe.directory /workspace
          git submodule update --init --recursive
          python -m pip install --upgrade pip
          python -m pip install uv coverage==7.6.1 bce-python-sdk==0.8.74 wrapt pytest
          wget -q https://paddle-github-action.cdn.bcebos.com/PaddleFormers/PR/${PR_ID}/${COMMIT_ID}/paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl
          wget -q https://paddle-github-action.cdn.bcebos.com/PaddleFormers/PR/${PR_ID}/${COMMIT_ID}/paddleformers-0.0.1.dev-py3-none-any.whl
          python -m pip install paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/
          python -m pip install paddleformers-0.0.1.dev-py3-none-any.whl --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/
          python -c "import paddleformers; import paddleformers.fleet; import paddlefleet_ops"
          '
      - name: Run single-card tests
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          export WITH_COVERAGE=ON
          bash scripts/fleet_ci/single_card_test.sh
          '
      - name: Cleanup
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash scripts/fleet_ci/clean_uv_cache.sh || true; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}
  multi-card-test:
    name: Fleet multi-card tests
    needs: [clone, build]
    runs-on:
      group: Fleet-H-multi-card
    env:
      TASK: paddleformers-fleet-multi-${{ github.event.pull_request.number }}
      REPO_ARCHIVE_URL: ${{ needs.clone.outputs.repo_archive_url }}
      PIP_CACHE_DIR: /home/.cache/pip
      CACHE_DIR: /home/.cache
    steps:
      - name: Run container
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          docker run -d -t --name ${container_name} --gpus all --shm-size=32G \
            -v "/dev/shm:/dev/shm" \
            -v ${{ github.workspace }}/../../..:/root \
            -v /ssd1/paddle-1/action_cache:/home/.cache \
            -v ${{ github.workspace }}:/workspace \
            -e no_proxy -e PR_ID -e COMMIT_ID -e BRANCH -e REPO_ARCHIVE_URL -e PIP_CACHE_DIR -e CACHE_DIR -e work_dir \
            -w /workspace --network host ${docker_image}
      - name: Install wheels
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          source /root/proxy || true
          wget -q --tries=5 --no-proxy ${REPO_ARCHIVE_URL} --no-check-certificate
          tar -xf PaddleFormers.tar.gz --strip-components=1
          rm PaddleFormers.tar.gz
          git config --global --add safe.directory /workspace
          git submodule update --init --recursive
          python -m pip install --upgrade pip
          python -m pip install uv coverage==7.6.1 bce-python-sdk==0.8.74 wrapt pytest
          wget -q https://paddle-github-action.cdn.bcebos.com/PaddleFormers/PR/${PR_ID}/${COMMIT_ID}/paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl
          wget -q https://paddle-github-action.cdn.bcebos.com/PaddleFormers/PR/${PR_ID}/${COMMIT_ID}/paddleformers-0.0.1.dev-py3-none-any.whl
          python -m pip install paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/
          python -m pip install paddleformers-0.0.1.dev-py3-none-any.whl --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          python -c "import paddleformers; import paddleformers.fleet; import paddlefleet_ops"
          '
      - name: Run multi-card tests
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          bash scripts/fleet_ci/multi-card_test.sh
          '
      - name: Cleanup
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash scripts/fleet_ci/clean_uv_cache.sh || true; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}
