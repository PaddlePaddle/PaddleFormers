name: Fleet Model Test

on:
  pull_request:
    branches:
      - develop

permissions: read-all

concurrency:
  group: ${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  PR_ID: ${{ github.event.pull_request.number || '0' }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  work_dir: /paddle
  PADDLE_ROOT: /paddle
  ci_scripts: /paddle/ci
  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
  CI_name: fleet-model-test
  no_proxy: "bcebos.com,.bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"
  docker_image: "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda129-coverage-test"

defaults:
  run:
    shell: bash

jobs:
  integration-test-H20-multi-card:
    name: Integration test (H20, multi-card)
    runs-on:
      group: Fleet-H-multi-card
    env:
      PIP_CACHE_DIR: /root/.cache/pip
      CACHE_DIR: /root/.cache
      TASK: formers-fleet-CI-${{ github.event.pull_request.number }}-integration-test-multi-card
    steps:
      - name: Check docker image and run container
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          docker run -d -t --name ${container_name} --gpus all --shm-size=32G \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../../proxy:/root/proxy \
            -v /ssd1/paddle-1/action_cache:/root/.cache \
            -v ${{ github.workspace }}:/workspace \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e CI_name \
            -e PIP_CACHE_DIR \
            -e GITHUB_SHA="${{ github.event.pull_request.head.sha }}" \
            -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
            -e GITHUB_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            -e GITHUB_REPO_NAME="${{ github.repository }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_EVENT_PULL_REQUEST_NUMBER="${{ github.event.pull_request.number }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -w /workspace --network host ${docker_image}

      - name: Install PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          source /root/proxy
          git clone https://github.com/PaddlePaddle/PaddleFleet.git
          cd PaddleFleet
          git config --global --add safe.directory /workspace/PaddleFleet
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          mkdir -p /root/.cache/pip
          pip cache dir
          pip install --upgrade pip
          echo "Install uv"
          pip install uv
          echo "uv sync"
          git submodule update --init --recursive
          uv sync --group ci -v > /dev/null
          export UV_SKIP_WHEEL_FILENAME_CHECK=1
          uv pip install https://paddle-qa.bj.bcebos.com/paddle-pipeline/Develop-GpuAll-LinuxCentos-Gcc11-Cuda129-Cudnn99-Trt105-Py310-Compile/latest/paddlepaddle_gpu-0.0.0-cp310-cp310-linux_x86_64.whl --index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/ --force-reinstall
          source .venv/bin/activate
          python -c "import paddle; print(paddle.version.commit)"
          '

      - name: Install PaddleFormers
        id: formers_install
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          git clone https://github.com/PaddlePaddle/PaddleFormers.git
          cd PaddleFormers
          cp examples/experiments/paddlefleet/glm45.json examples/experiments/paddlefleet/glm45_fp8.json
          git config --global --add safe.directory /workspace/PaddleFormers
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git pull --no-edit origin pull/3200/head
          git pull --no-edit origin pull/${PR_ID}/head
          source ../PaddleFleet/.venv/bin/activate
          pip install -e .
          python -c "import paddle; print(paddle.version.commit)"
          '

      - name: Integration test (GLM4.5 multi-card)
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          bash -x PaddleFleet/ci/integration_test/glm45.sh | tee glm45.log
          glm45_exit_code=$?
          source /workspace/PaddleFleet/.venv/bin/activate
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "Integration test failed: GLM4.5, try to analyze log."
            python PaddleFleet/ci/check_log_for_exitcode.py glm45.log integration true
            find_error_exit_code=$?
            if [[ "$find_error_exit_code" != "0" ]]; then
              echo -e "::error:: \033[31mIntegration test failed: GLM4.5.\033[0m"
            else
              echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
            fi
            exit $find_error_exit_code
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
          fi
          '

      - name: Integration test (GLM4.5 multi-card FP8)
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          bash -x PaddleFleet/ci/integration_test/glm45_fp8.sh | tee glm45_fp8.log
          glm45_exit_code=$?
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "Integration test failed: GLM4.5, try to analyze log."
            python PaddleFleet/ci/check_log_for_exitcode.py glm45_fp8.log integration true
            find_error_exit_code=$?
            if [[ "$find_error_exit_code" != "0" ]]; then
              echo -e "::error:: \033[31mIntegration test failed: GLM4.5 FP8.\033[0m"
            else
              echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
            fi
            exit $find_error_exit_code
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
          fi
          '

      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}

  integration-test-a100:
    name: Integration test (A100)
    runs-on:
      group: Distribute
    env:
      PIP_CACHE_DIR: /root/.cache/pip
      CACHE_DIR: /root/.cache
      TASK: formers-fleet-CI-${{ github.event.pull_request.number }}-integration-test-A100
    steps:
      - name: Check docker image and run container
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          docker run -d -t --name ${container_name} --gpus all --shm-size=32G \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../../proxy:/root/proxy \
            -v /ssd1/paddle-1/action_cache:/root/.cache \
            -v ${{ github.workspace }}:/workspace \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e CI_name \
            -e PIP_CACHE_DIR \
            -e GITHUB_SHA="${{ github.event.pull_request.head.sha }}" \
            -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
            -e GITHUB_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            -e GITHUB_REPO_NAME="${{ github.repository }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_EVENT_PULL_REQUEST_NUMBER="${{ github.event.pull_request.number }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -w /workspace --network host ${docker_image}

      - name: Install PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          source /root/proxy
          git clone https://github.com/PaddlePaddle/PaddleFleet.git
          cd PaddleFleet
          git config --global --add safe.directory /workspace/PaddleFleet
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          mkdir -p /root/.cache/pip
          pip cache dir
          pip install --upgrade pip
          echo "Install uv"
          pip install uv
          echo "uv sync"
          git submodule update --init --recursive
          uv sync --group ci > /dev/null
          export UV_SKIP_WHEEL_FILENAME_CHECK=1
          uv pip install https://paddle-qa.bj.bcebos.com/paddle-pipeline/Develop-GpuAll-LinuxCentos-Gcc11-Cuda129-Cudnn99-Trt105-Py310-Compile/latest/paddlepaddle_gpu-0.0.0-cp310-cp310-linux_x86_64.whl --index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/ --force-reinstall
          source .venv/bin/activate
          python -c "import paddle; print(paddle.version.commit)"
          '

      - name: Install PaddleFormers
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          git clone https://github.com/PaddlePaddle/PaddleFormers.git
          cd PaddleFormers
          git config --global --add safe.directory /workspace/PaddleFormers
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git pull --no-edit origin pull/3200/head
          git pull --no-edit origin pull/${PR_ID}/head
          source ../PaddleFleet/.venv/bin/activate
          pip install -e .
          python -c "import paddle; print(paddle.version.commit)"
          '

      - name: Integration test (GLM4.5)
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          bash -x PaddleFleet/ci/integration_test/glm45_a100.sh | tee glm45_a100.log
          glm45_exit_code=$?
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "Integration test failed: GLM4.5, try to analyze log."
            python PaddleFleet/ci/check_log_for_exitcode.py glm45_a100.log integration false
            find_error_exit_code=$?
            if [[ "$find_error_exit_code" != "0" ]]; then
              echo -e "::error:: \033[31mIntegration test failed: GLM4.5.\033[0m"
            else
              echo -e "\033[32mLog analysis did not find specific errors.\033[0m"
            fi
            exit $find_error_exit_code
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
          fi
          '

      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}

