name: PR update paddlefleet_ops
on:
  push:
    branches:
      - develop
      - 'release/**'
    tags:
      - 'v*'
permissions: read-all
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true
env:
  PR_ID: '0'
  COMMIT_ID: ${{ github.sha }}
  BRANCH: ${{ github.ref_name }}
defaults:
  run:
    shell: bash
jobs:
  check-packages-changes:
    name: Check paddlefleet_ops changes
    runs-on:
      group: APPROVAL
    outputs:
      packages_changed: ${{ steps.check.outputs.packages_changed }}
    steps:
      - name: Cleanup
        run: |
          rm -rf * .[^.]*
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Check changes
        id: check
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "packages_changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD -- packages/paddlefleet_ops/ .gitmodules pyproject.toml | grep -q .; then
            echo "packages_changed=true" >> $GITHUB_OUTPUT
          else
            echo "packages_changed=false" >> $GITHUB_OUTPUT
          fi
  clone:
    name: Clone PaddleFormers
    needs: check-packages-changes
    if: needs.check-packages-changes.outputs.packages_changed == 'true'
    uses: ./.github/workflows/_clone_linux.yml
  publish-ops-wheel:
    name: Update paddlefleet_ops (${{ matrix.cuda.CUDA_VERSION }}, python${{ matrix.python_version }})
    needs: clone
    if: github.repository == 'PaddlePaddle/PaddleFormers'
    runs-on:
      group: GZ_BD-CPU
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13"]
        cuda:
          - {CUDA_VERSION: CUDA12.9, IMAGE_TAG: cuda12.9-cudnn9.9-trt10.5-gcc11, bos_CUDA: cu129, CUDA_ARCH_LIST: "8.0;9.0;10.0;10.3"}
          - {CUDA_VERSION: CUDA13.0, IMAGE_TAG: cuda13.0-cudnn9.13-trt10.13-gcc11, bos_CUDA: cu130, CUDA_ARCH_LIST: "8.0;9.0;10.0;10.3"}
          - {CUDA_VERSION: CUDA13.2, IMAGE_TAG: cuda13.2-cudnn9.20-trt10.16-gcc11, bos_CUDA: cu132, CUDA_ARCH_LIST: "8.0;9.0;10.0;10.3"}
    env:
      TASK: PR-PaddleFormers-ops-${{ matrix.cuda.CUDA_VERSION }}-${{ matrix.python_version }}
      REPO_ARCHIVE_URL: ${{ needs.clone.outputs.repo_archive_url }}
      PIP_CACHE_DIR: /home/.cache/pip
      CACHE_DIR: /home/.cache
      CCACHE_DIR: "/home/data/shared/.ccache/l1"
      CCACHE_SECONDARY_STORAGE: "file:///home/data/cfs/.ccache/l2"
      CCACHE_MAXSIZE: 50G
      CCACHE_LIMIT_MULTIPLE: 0.8
      UV_HTTP_TIMEOUT: 600
      no_proxy: ".bcebos.com,bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"
    steps:
      - name: Run container
        run: |
          docker_image="ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle_manylinux_devel:${{ matrix.cuda.IMAGE_TAG }}"
          docker pull $docker_image
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker run -d -t --name ${container_name} \
            -v "/home/data/cfs:/home/data/cfs" \
            -v "/home/data/cfs/.cache:/home/.cache" \
            -v "/home/data/shared:/home/data/shared" \
            -v ${{ github.workspace }}/../../..:/root \
            -v ${{ github.workspace }}/../../../proxy:/root/proxy \
            -v ${{ github.workspace }}:/workspace \
            -e no_proxy -e CACHE_DIR -e PIP_CACHE_DIR -e CCACHE_DIR -e CCACHE_SECONDARY_STORAGE \
            -e CCACHE_MAXSIZE -e CCACHE_LIMIT_MULTIPLE -e UV_HTTP_TIMEOUT -e PR_ID -e COMMIT_ID -e BRANCH \
            -e REPO_ARCHIVE_URL -e PADDLE_CUDA_ARCH_LIST="${{ matrix.cuda.CUDA_ARCH_LIST }}" \
            -e AK=${{ secrets.BOS_CREDENTIAL_AK }} -e SK=${{ secrets.BOS_CREDENTIAL_SK }} \
            -w /workspace --network=host $docker_image
      - name: Build and upload
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xc '
          rm -rf * .[^.]*
          export LD_LIBRARY_PATH=/opt/_internal/cpython-${{ matrix.python_version }}.0/lib/:${LD_LIBRARY_PATH}
          export PATH=/opt/_internal/cpython-${{ matrix.python_version }}.0/bin/:${PATH}
          export UV_PYTHON=${{ matrix.python_version }}
          source /root/proxy || true
          wget -q --tries=5 --no-proxy ${REPO_ARCHIVE_URL} --no-check-certificate
          tar -xf PaddleFormers.tar.gz --strip-components=1
          rm PaddleFormers.tar.gz
          git config --global --add safe.directory /workspace
          git submodule update --init --recursive
          sed -i "s#packages/nightly/cu129#packages/nightly/${{ matrix.cuda.bos_CUDA }}#g" pyproject.toml
          python -m pip install --upgrade pip
          python -m pip install uv bce-python-sdk==0.8.74
          uv build --wheel --package paddlefleet-ops --out-dir dist
          python -m pip install dist/paddlefleet_ops-*.whl --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/${{ matrix.cuda.bos_CUDA }}/
          python -c "import paddlefleet_ops"
          wget -q --no-proxy https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
          mkdir -p bos
          tar -xf bos_new.tar.gz -C bos
          cd dist
          PYTAG="cp$(echo '${{ matrix.python_version }}' | tr -d '.')"
          if [[ "${BRANCH}" == "develop" ]]; then
            cp paddlefleet_ops-*.whl paddlefleet_ops-0.0.0-${PYTAG}-${PYTAG}-linux_x86_64.whl
            WHEEL_FILE=$(ls paddlefleet_ops-0.0.0-cp*-linux_x86_64.whl | head -n1)
          else
            cp paddlefleet_ops-*.whl paddlefleet_ops-0.0.0.post-${PYTAG}-${PYTAG}-linux_x86_64.whl
            WHEEL_FILE=$(ls paddlefleet_ops-0.0.0.post-cp*-linux_x86_64.whl | head -n1)
          fi
          python ../bos/BosClient.py "${WHEEL_FILE}" paddle-whl/nightly/${{ matrix.cuda.bos_CUDA }}/paddlefleet-ops
          python ../bos/BosClient.py "${WHEEL_FILE}" paddle-github-action/PaddleFormers/${BRANCH}/latest/${{ matrix.cuda.bos_CUDA }}
          curl https://www.paddlepaddle.org.cn/inner/whl/update/path/new || true
          '
      - name: Cleanup
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash scripts/fleet_ci/clean_uv_cache.sh || true; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}
