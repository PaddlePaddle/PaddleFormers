    needs: clone
    if: github.repository == 'PaddlePaddle/PaddleFormers'
    runs-on:
      group: npu-arm
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.12"]
        cuda:
          - {CUDA_VERSION: CUDA13.0, bos_CUDA: cu130, IMAGE_TAG: cuda130-dev-arm-py312}
          - {CUDA_VERSION: CUDA13.2, bos_CUDA: cu132, IMAGE_TAG: cuda132-dev-arm-py312}
    env:
      TASK: PaddleFormers-nightly-arm-${{ matrix.cuda.CUDA_VERSION }}
      PIP_CACHE_DIR: /home/.cache/pip
