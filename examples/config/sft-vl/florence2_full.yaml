### data
# Florence-2 takes one image and one single-turn task per sample, e.g.
# {"messages":[{"role":"user","content":"<image><CAPTION>"},{"role":"assistant","content":"A cat."}],
#  "images":["/path/to/image.jpg"]}
# packing / padding_free are not supported for this encoder-decoder model.
train_dataset_type: messages
eval_dataset_type: messages
train_dataset_path: ./tests/fixtures/dummy/sft-vl/florence2_train.jsonl
train_dataset_prob: "1.0"
eval_dataset_path: ./tests/fixtures/dummy/sft-vl/florence2_train.jsonl
eval_dataset_prob: "1.0"
max_seq_len: 1024
packing: false
mix_strategy: concat
template_backend: custom
template: florence2

### model
# The model directory must ship the Florence-2 tokenizer with its task tokens (<loc_*>, <od>, ...).
# Original microsoft/Florence-2-* checkpoints rely on the processor to add them; convert a local copy once with
#   AutoProcessor.from_pretrained(path).tokenizer.save_pretrained(path)
model_name_or_path: microsoft/Florence-2-base

### finetuning
# base
stage: VL-SFT
fine_tuning: full
seed: 23
do_train: true
do_eval: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
num_train_epochs: 1
max_steps: -1
eval_steps: 100
evaluation_strategy: steps
save_steps: 100
save_strategy: steps
logging_steps: 1
gradient_accumulation_steps: 1
output_dir: ./checkpoints/florence2-sft-full
disable_tqdm: true

# train
warmup_steps: 0
learning_rate: 1.0e-5

# performance
tensor_model_parallel_size: 1
pipeline_model_parallel_size: 1
bf16: true
fp16_opt_level: O1
convert_from_hf: true
unified_checkpoint: false
save_checkpoint_format: "flex_checkpoint"
load_checkpoint_format: "flex_checkpoint"
