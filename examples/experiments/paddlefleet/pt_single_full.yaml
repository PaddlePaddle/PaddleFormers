### data
dataset_type: "pretrain"
input_dir: "1.0 ../data/pre-training/llama_openwebtext_100k"
split: "998,1,1"
max_seq_len: 8192
mix_strategy: concat

### model
model_name_or_path: ../zai-org/GLM-4.5-Air
# attn_impl: flashmask

### finetuning
# base
stage: PT
fine_tuning: full
seed: 23
do_train: true
do_eval: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
num_train_epochs: 1
max_steps: 10
eval_steps: 100
eval_iters: 100
evaluation_strategy: steps
save_steps: 100
save_strategy: steps
logging_steps: 1
gradient_accumulation_steps: 1
logging_dir: ./4_layer_single_card_glm_vdl_log
output_dir: ./checkpoints/4_layer_single_card_glm_pretrain_ckpts
disable_tqdm: true
eval_accumulation_steps: 16

# train
warmup_steps: 0
learning_rate: 1.0e-5

# special
max_grad_norm: 0
min_learning_rate: 0

# performance
fuse_attention_qkv: true
fuse_attention_ffn: true
tensor_parallel_degree: 1
pipeline_parallel_degree: 1
use_expert_parallel: false
sequence_parallel: false
sharding_parallel_config: split_param 
amp_master_grad: true
sharding: stage1
recompute: false
bf16: true
fp16_opt_level: O2
load_via_cpu: true
save_to_hf: false
#unified_checkpoint: true
save_checkpoint_format: "flex_checkpoint"
load_checkpoint_format: "flex_checkpoint"

