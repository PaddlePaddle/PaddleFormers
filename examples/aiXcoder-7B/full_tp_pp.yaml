### data
train_dataset_type: erniekit
eval_dataset_type: erniekit
train_dataset_path: /workspace/pretrainning/data/pt/train_sft.jsonl
train_dataset_prob: "1.0"
eval_dataset_path: /workspace/pretrainning/data/pt/eval_sft.jsonl
eval_dataset_prob: "1.0"
max_seq_len: 1024
num_samples_each_epoch: 100
packing: true
mix_strategy: concat

### model
model_name_or_path: /workspace/aixcoder-7b-base-pd-converted
convert_from_hf: false
save_to_hf: false
attn_impl: flashmask

### finetuning
# base
stage: SFT
fine_tuning: full
seed: 23
do_train: true
do_eval: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
num_train_epochs: 1
max_steps: -1
eval_steps: 100
evaluation_strategy: steps
save_steps: 100
save_total_limit: 1
save_strategy: steps
logging_steps: 1
gradient_accumulation_steps: 4
logging_dir: /workspace/pretrainning/vdl_log
output_dir: /workspace/pretrainning/checkpoints/aixcoder-7b-base-pd-converted_sft_ckpts_parallel
disable_tqdm: true
eval_accumulation_steps: 16

# train
warmup_steps: 20
learning_rate: 1.0e-5

# performance
tensor_parallel_degree: 8
pipeline_parallel_degree: 1
sequence_parallel: true
sharding: stage1
recompute: true
bf16: true
fp16_opt_level: O2
unified_checkpoint: true
