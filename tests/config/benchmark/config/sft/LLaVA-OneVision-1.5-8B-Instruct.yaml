### data
train_dataset_type: messages
eval_dataset_type: messages
train_dataset_path: /root/paddlejob/share-storage/gpfs/system-public/efficient_benchmark/dataset/coco_grounding/train_absolute_path.jsonl
train_dataset_prob: "1.0"
eval_dataset_path: /root/paddlejob/share-storage/gpfs/system-public/efficient_benchmark/dataset/coco_grounding/val.jsonl
eval_dataset_prob: "1.0"
max_seq_len: 8192
packing: true
mix_strategy: concat
template_backend: custom
template: llavaonevision1_5

### model
model_name_or_path: /root/paddlejob/share-storage/gpfs/system-public/efficient_benchmark/huggingface/lmms-lab/LLaVA-OneVision-1.5-8B-Instruct
_attn_implementation: eager

### finetuning
# base
stage: VL-SFT
fine_tuning: full
seed: 23
do_train: true
do_eval: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
num_train_epochs: 1
max_steps: 300
eval_steps: 500
evaluation_strategy: steps
save_steps: 500
save_strategy: steps
logging_steps: 1
save_total_limit: 1
gradient_accumulation_steps: 32
logging_dir: ./vdl_log_sft_full_tp_8B_llavaonevision1_5
output_dir: ./checkpoints/llavaonevision1_5-sft-full-tp-8B
disable_tqdm: true
eval_accumulation_steps: 16

# train
warmup_ratio: 0.05
warmup_steps: 20
learning_rate: 1.0e-5

# performance
tensor_model_parallel_size: 2
pipeline_model_parallel_size: 1
sharding: stage1
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
bf16: true
fp16_opt_level: O2
unified_checkpoint: false
save_checkpoint_format: "flex_checkpoint"
load_checkpoint_format: "flex_checkpoint"
freeze_config: freeze_vision freeze_aligner

benchmark: true
dataloader_num_workers: 8
prefetch_factor: 8
