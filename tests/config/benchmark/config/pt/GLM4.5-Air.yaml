### data
train_dataset_type: erniekit
eval_dataset_type: erniekit
train_dataset_path: ./data/pt/train.jsonl
train_dataset_prob: '1.0'
eval_dataset_path: ./data/pt/eval.jsonl
eval_dataset_prob: '1.0'
packing: true
max_seq_len: 8192
mix_strategy: concat

### model
model_name_or_path: /root/paddlejob/gpfs/efficient_benchmark/huggingface/GLM-4.5-Air
attn_impl: flashmask

### finetuning
# base
stage: PT
fine_tuning: full
seed: 23
do_train: true
do_eval: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
num_train_epochs: 1
max_steps: 30
eval_iters: 10
eval_steps: 100
evaluation_strategy: steps
save_steps: 100
save_strategy: steps
logging_steps: 1
gradient_accumulation_steps: 64
logging_dir: ./vdl_log
output_dir: /root/paddlejob/tmpspace/GLM-4.5-Air-PT/outputs/checkpoint
disable_tqdm: true
eval_accumulation_steps: 16

#args
router_aux_loss_coef: 0.001

# train
warmup_steps: 20
learning_rate: 1.0e-05
random_shuffle: false

# performance
tensor_model_parallel_size: 4
pipeline_model_parallel_size: 4
use_expert_parallel: true
expert_model_parallel_size: 8
sequence_parallel: true
num_empty_layers_add_in_head: 1
num_empty_layers_add_in_tail: 1

# sharding_parallel_config
split_param: true

amp_master_grad: true
sharding: stage1
stage1_overlap: true
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
moe_grouped_gemm: true
moe_deep_gemm: true
apply_rope_fusion: true
fuse_rms_norm: true
moe_router_force_load_balancing: true

# pp
pp_delay_scale_loss: true
overlap_p2p_comm: true
variable_seq_lengths: true
best_unbalanced_scheduler: true

tp_delay_scale_loss: true

bf16: true
fp16_opt_level: O2
unified_checkpoint: false
load_via_cpu: true
save_checkpoint_format: flex_checkpoint
load_checkpoint_format: flex_checkpoint
save_to_hf: true

benchmark: true
num_empty_layers_add_in_head: 1
num_empty_layers_add_in_tail: 1
continue_training: false
dataloader_shuffle: false

dataloader_num_workers: 24
prefetch_factor: 24
