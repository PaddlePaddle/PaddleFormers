### data
train_dataset_type: erniekit
eval_dataset_type: erniekit
train_dataset_path: ./tests/fixtures/dummy/sft/train.jsonl
train_dataset_prob: "1.0"
eval_dataset_path: ./tests/fixtures/dummy/sft/eval.jsonl
eval_dataset_prob: "1.0"
max_seq_len: 512
packing: false
dataloader_shuffle: false
mix_strategy: concat
template_backend: custom
template: internlm3
### model
model_name_or_path: Shanghai_AI_Laboratory/internlm3-8b-instruct
_attn_implementation: flashmask
num_hidden_layers: 3


### finetuning
# base
stage: SFT
fine_tuning: full
seed: 23
do_train: true
do_eval: true
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
num_train_epochs: 1
max_steps: 500
eval_steps: 1000
evaluation_strategy: steps
save_steps: 100000
save_strategy: steps
logging_steps: 1
gradient_accumulation_steps: 4
logging_dir: ./vdl_log
output_dir: ./checkpoints/internlm3-sft-full
disable_tqdm: true
eval_accumulation_steps: 16


# train
warmup_steps: 5
learning_rate: 1.0e-5

# performance
tensor_model_parallel_size: 1
pipeline_model_parallel_size: 1
sharding: stage1
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
bf16: true
fp16_opt_level: O2
unified_checkpoint: false
save_checkpoint_format: flex_checkpoint
load_checkpoint_format: flex_checkpoint
continue_training: false

# 显式固定历史默认值；避免新默认值改变此配置行为。
weight_decay: 0.0
adam_beta2: 0.999
moe_router_bias_update_rate: 0.0
save_safetensors: false
overlap_p2p_comm: false
batch_p2p_comm: true
mtp_loss_scaling_factor: 0.3
