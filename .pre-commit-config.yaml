repos:
# For Python files - 更新版本
-   repo: https://github.com/psf/black
    rev: 23.9.1  # 更新到最新
    hooks:
    -   id: black
        files: \.(py|pyi)$
        args: [--config=pyproject.toml]  # 指定配置

-   repo: https://github.com/PyCQA/isort
    rev: 5.12.0  # 更新到最新
    hooks:
    -   id: isort
        args: [--settings-path=pyproject.toml]  # 指定配置

-   repo: https://github.com/PyCQA/flake8
    rev: 6.0.0  # 更新到最新
    hooks:
    -   id: flake8
        args: [--config=setup.cfg]  # 或 pyproject.toml

# 使用官方 hooks 替代 Lucas-C 的 hooks
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0  # 更新到最新
    hooks:
    -   id: check-merge-conflict
    -   id: check-symlinks
    -   id: detect-private-key
        exclude: .*paddle.*  # 更清晰的排除模式
    -   id: end-of-file-fixer
        types: [markdown]
    -   id: trailing-whitespace
        types: [markdown]
    -   id: mixed-line-ending  # 替代 CRLF 相关功能
        args: [--fix=lf]
        types: [markdown]

# Local hooks - 改进配置
-   repo: local
    hooks:
    -   id: copyright_checker
        name: copyright_checker
        entry: .copyright.hook  # 直接执行，假设有 shebang
        language: script  # 改为 script
        files: \.(c|cc|cxx|cpp|cu|h|hpp|hxx|proto|xpu|kps|py|sh)$

-   repo: local
    hooks:
    -   id: add-spaces-between-chinese-and-english
        name: Add spaces between Chinese and English characters
        entry: python scripts/codestyle/check_spaces.py
        language: python
        files: \.(md|markdown)$
        pass_filenames: true

-   repo: local
    hooks:
    -   id: check-dead-links
        name: Check dead links
        entry: python scripts/codestyle/check_dead_links.py
        language: python
        files: \.(md|markdown|rst)$
        pass_filenames: true