exclude: ^Research/RRAttention/eval/HELMET/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/Lucas-C/pre-commit-hooks.git
    rev: v1.5.1
    hooks:
      - id: remove-crlf
      - id: remove-tabs
        name: Tabs remover (C++)
        files: \.(c|cc|cxx|cpp|cu|h|cuh|hpp|hxx)$
        args: [--whitespaces-count, '2']
      - id: remove-tabs
        name: Tabs remover (Python)
        files: \.(py|pyi)$
        args: [--whitespaces-count, '4']
  - repo: local
    hooks:
      - id: copyright_checker
        name: copyright_checker
        entry: python ./scripts/fleet_ci/hooks/copyright.py
        language: system
        files: \.(c|cc|cxx|cpp|cu|h|cuh|hpp|hxx|py|pyi|sh)$
  - repo: https://github.com/PFCCLab/typos-pre-commit-mirror.git
    rev: v1.41.0
    hooks:
      - id: typos
        args: [--force-exclude]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --no-cache]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.7
    hooks:
      - id: clang-format
        files: \.(c|cc|cxx|cpp|cu|h|cuh|hpp|hxx|xpu|kps)$
  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint
        files: \.(cc|cxx|cpp|cu|h|hpp|hxx)$
        args:
          - --extensions=cc,cxx,cpp,cu,cuh,h,hpp,hxx,kps
          - --filter=-readability/fn_size,-build/include_what_you_use,-build/c++11,-whitespace/parens,-whitespace/indent_namespace
          - --quiet
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
  - repo: https://github.com/PFCCLab/cmake-lint-paddle
    rev: v1.5.1
    hooks:
      - id: cmakelint
  - repo: https://github.com/PFCCLab/yamlfmt-pre-commit-mirror.git
    rev: v0.16.0
    hooks:
      - id: yamlfmt
        exclude: |
          (?x)^(
            \.clang-format|
            \.github/workflows/cherry-pick\.yml|
            \.github/ISSUE_TEMPLATE/others\.yml
          )$
  - repo: https://github.com/PFCCLab/ast-grep-pre-commit-mirror
    rev: v0.40.0.1
    hooks:
      - id: ast-grep
